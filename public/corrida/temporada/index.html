  <script type="module">
    // o editor do capacete na aba "Capacete" da Central (central.js chama window.CapaceteCarreira.montar no lugar marcado)
    import { montarEditorCapacete } from "/corrida/capacete-editor-ui.js";
    let caixa = null;
    window.CapaceteCarreira = { montar(lugar) { if (!caixa) { caixa = document.createElement("section"); caixa.className = "cx-card cx-capacete cp-cartao"; montarEditorCapacete(caixa, { sub: "vai para a pista na próxima corrida" }); } else caixa._capacete.redesenhar(); lugar.replaceWith(caixa); } };
    window.dispatchEvent(new Event("capacete:pronto"));
  </script>
  <script type="module">
    // (2026-11-25) os retratos em pixel art para as notícias (stories.js pxDe): os pilotos da tabela pelo id (a sigla do grid do ano) e o seu, do montador
    import { retratoDoJogador, retrato, tracosSorteados } from "/corrida/pixel-piloto.js";
    import { lerPixel } from "/corrida/piloto-pixel-editor.js";
    window.PixelPiloto = { porId(id, cor) {
      const P = window.F1Pilotos, pl = P && P.PILOTOS.find((p) => p.id === id), eq = pl && P.EQUIPES[pl.equipe];
      if (id === "voce") return retrato(lerPixel() || tracosSorteados("voce"), { cor: cor || "#e10600" });
      return pl ? retratoDoJogador({ sigla: pl.sigla, nomeCompleto: pl.nome, equipe: pl.equipe, bot: true }, eq && eq.cor) : "";
    } };
    // (2026-11-25) o montador do seu piloto em pixel art na aba "Meu piloto" da Central (central.js chama window.PilotoCarreira.montar no lugar marcado).
    // Fica guardado neste navegador e vai para a pista na próxima corrida (piloto-pixel-editor.js sincronizarPixel)
    import { montarMontador } from "/corrida/piloto-pixel-editor.js"; // (o lerPixel já vem do import de cima, das notícias: importar de novo derrubava o módulo)
    import { camadasInteiro, marcasReaisProntas } from "/corrida/pixel-piloto.js";
    let caixa = null, tela = null, cor = null;
    // (2026-11-25, o Thiago: "enquanto eu estiver fazendo o piloto, ele deve aparecer em pé, inteiro, do lado direito") a vitrine: o piloto de corpo
    // inteiro (pixel-piloto.js retratoInteiro), grande, sobre um holofote, respirando; muda a cada clique do montador
    const st = document.createElement("style");
    st.textContent = `.cx-piloto-tela{display:grid;grid-template-columns:minmax(0,640px) 1fr;gap:24px;align-items:stretch}
      .cx-piloto-vitrine{position:relative;display:grid;place-items:end center;min-height:min(78vh,720px);padding-bottom:4vh}
      .cx-piloto-vitrine::before{content:"";position:absolute;left:50%;bottom:3vh;width:min(340px,70%);height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,#0007,transparent)}
      .cx-piloto-vitrine::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 60% at 50% 55%,color-mix(in srgb,var(--px-cor,#e10600) 22%,transparent),transparent 70%);pointer-events:none}
      .cx-piloto-vitrine img{position:relative;z-index:1;height:min(74vh,700px);width:auto;image-rendering:pixelated;filter:drop-shadow(0 14px 24px #0005);animation:pxRespira 3.2s ease-in-out infinite;transform-origin:50% 100%}
      .cx-piloto-vitrine img.troca{animation:pxTroca .35s cubic-bezier(.2,1.4,.4,1),pxRespira 3.2s .35s ease-in-out infinite}
      @keyframes pxRespira{50%{transform:scaleY(1.012) translateY(-2px)}}
      @keyframes pxTroca{from{transform:scale(.94) translateY(8px);opacity:.6}}
      @media (max-width:900px){.cx-piloto-tela{grid-template-columns:1fr}.cx-piloto-vitrine{min-height:0}.cx-piloto-vitrine img{height:52vh}}
      @media (prefers-reduced-motion:reduce){.cx-piloto-vitrine img{animation:none}}
      /* (2026-11-25, o Thiago: "o piloto não devia ficar parado; devia interagir às vezes e interagir com o mouse") as camadas: o corpo, o braço e a cabeça */
      .px-fig{position:relative;z-index:1;height:min(74vh,700px);aspect-ratio:var(--px-ar,48/116);cursor:pointer;filter:drop-shadow(0 14px 24px #0005);transform-origin:50% 100%}
      .px-fig>*{position:absolute;inset:0}.px-fig img{width:100%;height:100%;image-rendering:pixelated;animation:none;filter:none;height:100%}
      .px-cab,.px-braco,.px-corpo{will-change:transform}
      .px-olho{position:absolute;background:var(--px-pele);transform:scaleY(0);transform-origin:50% 0;transition:transform .06s}
      .px-fig.pisca .px-olho{transform:scaleY(1)}
      .px-fig.troca{animation:pxTroca .35s cubic-bezier(.2,1.4,.4,1)}
      @media (prefers-reduced-motion:reduce){.px-fig,.px-fig *{animation:none!important;transition:none!important}}`;
    document.head.appendChild(st);
    // a figura: as camadas de pixel-piloto.js camadasInteiro; a cabeça segue o mouse, pisca, e de vez em quando ele acena, pula ou olha em volta; no
    // clique, pula e acena. Os logos de verdade do macacão chegam depois (marcasReaisProntas) e a figura se refaz
    let ultimoT = null, equipeAtual = null, ultimoMouse = 0;
    const fig = () => tela && tela.querySelector(".px-fig");
    const fazer = (cls, ms) => { const f = fig(); if (!f || f.classList.contains(cls)) return; f.classList.add(cls); setTimeout(() => f.classList.remove(cls), ms); };
    const pintarInteiro = (t, forcar) => {
      const f = fig(); if (!f || !t) return; const chave = JSON.stringify([t, cor, equipeAtual]); if (f._chave === chave && !forcar) return; f._chave = chave; ultimoT = t;
      const c = camadasInteiro(t, { cor: cor || "#e10600", equipe: equipeAtual, escala: 6 }); if (!c) return;
      const pct = (v, tot) => (v / tot * 100) + "%";
      f.style.setProperty("--px-ar", c.W + "/" + c.H); f.style.setProperty("--px-pele", c.pele);
      f.innerHTML = `<div class="px-corpo"><img alt="" src="${c.corpo}"></div><div class="px-braco" style="transform-origin:${pct(c.ombro[0], c.W)} ${pct(c.ombro[1], c.H)}"><img alt="" src="${c.braco}"></div>
        <div class="px-cab" style="transform-origin:${pct(c.pescoco[0], c.W)} ${pct(c.pescoco[1], c.H)}"><img alt="" src="${c.cabeca}">${c.olhos.map(([x, y, w, h]) => `<i class="px-olho" style="left:${pct(x, c.W)};top:${pct(y, c.H)};width:${pct(w, c.W)};height:${pct(h, c.H)}"></i>`).join("")}</div>`;
      if (!forcar) { f.classList.remove("troca"); void f.offsetWidth; f.classList.add("troca"); setTimeout(() => f.classList.remove("troca"), 400); }
    };
    marcasReaisProntas.then(() => { if (ultimoT) pintarInteiro(ultimoT, true); });
    // o mouse: a cabeça vira e inclina para onde ele está (e o corpo inclina de leve)
    // (2026-11-25, o Thiago: "a animação do piloto ficou meio ruim: tem que ser algo idle, natural") um laço com molas suaves, sem gestos que saltam: o
    // corpo respira e passa o peso de uma perna para a outra; a cabeça segue o mouse com atraso (sem mouse, passeia o olhar devagar); o braço balança
    // de leve e às vezes ajeita a luva; o clique dá um aceno curto e um pulinho. Pisca a cada 2,5 a 5,5 s (às vezes duas vezes)
    const mola = { cab: { x: 0, r: 0, vx: 0, vr: 0 }, braco: { r: 0, v: 0 }, pulo: { y: 0, v: 0 } };
    let alvoCab = { x: 0, r: 0 }, vagar = { x: 0, r: 0, ate: 0 }, gesto = null;
    addEventListener("pointermove", (e) => {
      const f = fig(); if (!f || !f.isConnected) return; ultimoMouse = performance.now();
      const r = f.getBoundingClientRect(), dx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (innerWidth * 0.45))), dy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height * 0.2)) / (innerHeight * 0.5)));
      alvoCab = { x: dx * 1.2, y: dy * 0.4, r: dx * 5 };
    });
    const passoMola = (m, k, alvo, chave, vchave, dt, amort = 2 * Math.sqrt(k) * 0.9) => { const a = k * (alvo - m[chave]) - amort * m[vchave]; m[vchave] += a * dt; m[chave] += m[vchave] * dt; };
    let tAnt = performance.now();
    (function laco() {
      requestAnimationFrame(laco);
      const f = fig(); if (!f || !f.isConnected) return;
      const agora = performance.now(), dt = Math.min(0.05, (agora - tAnt) / 1000), t = agora / 1000; tAnt = agora;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      // a cabeça: o mouse (até 3 s depois do último movimento) ou o olhar passeando
      if (agora - ultimoMouse > 3000) { if (agora > vagar.ate) vagar = { x: (Math.random() - 0.5) * 1.4, r: (Math.random() - 0.5) * 7, ate: agora + 2200 + Math.random() * 3000 }; alvoCab = { x: vagar.x, y: 0, r: vagar.r }; }
      passoMola(mola.cab, 26, alvoCab.x, "x", "vx", dt); passoMola(mola.cab, 26, alvoCab.r, "r", "vr", dt);
      // o braço: o balanço leve, o gesto (ajeitar a luva ou o aceno do clique) por cima
      let alvoBraco = Math.sin(t * 1.1) * 2.2;
      if (gesto) { const u = (agora - gesto.ini) / gesto.dur; if (u >= 1) gesto = null; else alvoBraco += gesto.tipo === "aceno" ? (u < 0.2 ? -95 * (u / 0.2) : u > 0.8 ? -95 * ((1 - u) / 0.2) : -95 + Math.sin((u - 0.2) * Math.PI * 6) * 16) : -14 * Math.sin(u * Math.PI); }
      passoMola(mola.braco, gesto && gesto.tipo === "aceno" ? 60 : 30, alvoBraco, "r", "v", dt);
      passoMola(mola.pulo, 90, 0, "y", "v", dt);
      // o corpo: respira (3,6 s) e troca o peso de perna (7 s)
      const resp = Math.sin(t * 1.75) * 0.5 + 0.5, peso = Math.sin(t * 0.9);
      f.style.transform = `translate(${(peso * 0.35).toFixed(3)}%, ${mola.pulo.y.toFixed(3)}%) rotate(${(peso * 0.5).toFixed(3)}deg) scaleY(${(1 + resp * 0.008).toFixed(4)})`;
      const cab = f.querySelector(".px-cab"), braco = f.querySelector(".px-braco");
      if (cab) cab.style.transform = `translate(${mola.cab.x.toFixed(3)}%, ${(resp * -0.25 + (alvoCab.y || 0) * 0.5).toFixed(3)}%) rotate(${mola.cab.r.toFixed(2)}deg)`;
      if (braco) braco.style.transform = `rotate(${mola.braco.r.toFixed(2)}deg)`;
    })();
    const acenar = () => { gesto = { tipo: "aceno", ini: performance.now(), dur: 1700 }; mola.pulo.v = -55; };
    (function piscar() { setTimeout(() => { fazer("pisca", 120); if (Math.random() < 0.2) setTimeout(() => fazer("pisca", 110), 260); piscar(); }, 2500 + Math.random() * 3000); })();
    (function ajeitar() { setTimeout(() => { if (!gesto && performance.now() - ultimoMouse > 2000) gesto = { tipo: "luva", ini: performance.now(), dur: 1400 }; ajeitar(); }, 9000 + Math.random() * 9000); })();
    window.PilotoCarreira = { montar(lugar, c) {
      const eq = c && c.s && window.F1Pilotos && window.F1Pilotos.EQUIPES[c.s.equipe]; cor = (eq && eq.cor) || null; equipeAtual = (c && c.s && c.s.equipe) || null;
      if (!tela) { tela = document.createElement("div"); tela.className = "cx-piloto-tela"; tela.innerHTML = '<div class="cx-piloto-vitrine" aria-label="O seu piloto de corpo inteiro"><div class="px-fig" title="Clique: ele acena"></div></div>'; tela.querySelector(".px-fig").addEventListener("click", () => acenar()); }
      tela.style.setProperty("--px-cor", cor || "#e10600");
      if (!caixa) { caixa = document.createElement("section"); caixa.className = "cx-card cx-piloto"; caixa.innerHTML = "<h3 class=\"cx-piloto-tit\">Meu piloto</h3><p class=\"cx-piloto-sub\">Monte o seu piloto em pixel art: ele aparece na torre, nos cards e na apresentação do grid.</p><div class=\"px-cartao\"></div>"; }
      const ed = montarMontador(caixa.querySelector(".px-cartao"), { cor: () => cor, aoMudar: pintarInteiro });
      if (caixa.parentNode !== tela) tela.insertBefore(caixa, tela.firstChild);
      lugar.replaceWith(tela);
      pintarInteiro(lerPixel() || ed.atual());
    } };
    window.dispatchEvent(new Event("piloto:pronto"));
  </script>
  <script type="module">
    // o halo do carro na aba Carro (central.js marca o lugar com data-halo-lugar e chama window.HaloCarreira.montar)
    import { montarHalo } from "/corrida/halo-editor-ui.js";
    window.HaloCarreira = { montar: montarHalo };
    const hl = document.querySelector("[data-halo-lugar]"); if (hl) montarHalo(hl, hl.dataset.eq); // (se a aba já abriu antes deste módulo chegar)
  </script>
