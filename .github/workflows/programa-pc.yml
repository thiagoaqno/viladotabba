# Corrida da Galera — monta o PROGRAMA DE PC (o instalador para Windows) e publica na release "programa-pc" do GitHub.
# Roda só quando o Thiago manda (Actions > Programa de PC > Run workflow): é o "lançar update". O link para baixar fica sempre o mesmo:
#   https://github.com/thiagoaqno/viladotabba/releases/download/programa-pc/CorridaDaGalera-Setup.exe
# O que vai dentro: o lançador (desktop/Corrida.cs), um node.exe e o jogo (server.js e public/, sem testes nem docs).
name: Programa de PC

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Endereço do site (para jogar online e mandar os recordes): a raiz, sem o /corrida"
        required: true
        default: "https://viladotabba.com" # (o www redireciona para cá; um POST redirecionado perderia os recordes)

permissions:
  contents: write

jobs:
  montar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependências do jogo (sem as de teste)
        run: npm ci --omit=dev
      - name: Montar a pasta dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/app, dist/node | Out-Null
          Copy-Item (Get-Command node).Source dist/node/node.exe
          # o jogo: tudo, menos o que só serve para desenvolver
          # (as pastas a pular vão com o caminho inteiro: só o nome pularia também as de dentro do node_modules, como as dist/ das bibliotecas)
          $fora = '.git','.github','.claude','dados','tests','docs','planos','dist','saida','desktop','ferramentas-prints','test-results','playwright-report' | ForEach-Object { Join-Path $PWD $_ }
          robocopy . dist/app /E /NFL /NDL /NJH /NJS /XD $fora /XF *.md fly.toml
          if ($LASTEXITCODE -ge 8) { exit 1 } else { $global:LASTEXITCODE = 0 }
          Set-Content -NoNewline -Encoding ascii dist/site.txt "${{ inputs.site }}"
          # o ícone: um .ico com o PNG de 192 px dentro (o formato aceita PNG direto)
          $png = [IO.File]::ReadAllBytes("public/corrida/icone-192.png")
          $ico = New-Object IO.MemoryStream; $w = New-Object IO.BinaryWriter($ico)
          $w.Write([UInt16]0); $w.Write([UInt16]1); $w.Write([UInt16]1)
          $w.Write([Byte]192); $w.Write([Byte]192); $w.Write([Byte]0); $w.Write([Byte]0); $w.Write([UInt16]1); $w.Write([UInt16]32)
          $w.Write([UInt32]$png.Length); $w.Write([UInt32]22); $w.Write($png); $w.Flush()
          [IO.File]::WriteAllBytes("dist/corrida.ico", $ico.ToArray())
      - name: Conferir que o jogo montado liga
        shell: pwsh
        run: |
          # liga o servidor da pasta dist (o mesmo que o programa liga) e pede a página da Corrida: um arquivo faltando para aqui, não no PC de quem instala
          $env:PORT = "31999"; $env:DB_PATH = ":memory:"; $env:HOST = "127.0.0.1"
          $p = Start-Process -FilePath dist/node/node.exe -ArgumentList server.js -WorkingDirectory dist/app -PassThru -RedirectStandardError erro.txt -RedirectStandardOutput saida.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = (Invoke-WebRequest http://127.0.0.1:31999/corrida/pc.js -UseBasicParsing).StatusCode -eq 200 } catch { if ($p.HasExited) { break } } }
          if (-not $p.HasExited) { Stop-Process $p -Force }
          if (-not $ok) { Get-Content erro.txt, saida.txt; exit 1 }
      - name: Compilar o lançador
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -nologo -target:winexe "-win32icon:dist\corrida.ico" -r:System.Windows.Forms.dll "-out:dist\Corrida da Galera.exe" "desktop\Corrida.cs" # (com \: o csc le o / como opcao)
          if (!(Test-Path "dist/Corrida da Galera.exe")) { exit 1 }
      - name: Montar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:VERSAO_PC = "1.0.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "desktop\instalador.iss"
          if (!(Test-Path saida/CorridaDaGalera-Setup.exe)) { exit 1 }
      - name: Publicar na release programa-pc
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view programa-pc 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create programa-pc --title "Corrida da Galera para PC" --notes "O instalador da Corrida da Galera para Windows. Baixe, instale e jogue: funciona sem internet, e com internet entra nas salas do site." }
          gh release upload programa-pc saida/CorridaDaGalera-Setup.exe --clobber
