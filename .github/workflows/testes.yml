name: Testes da Corrida
# Os testes da Corrida (tests/corrida-*), que é o que se mexe hoje, em todo PR e em todo push na main. Os dos outros jogos
# continuam na pasta: `npm test` roda todos, quando precisar.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  corrida:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run test:corrida
